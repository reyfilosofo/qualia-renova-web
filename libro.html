<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#12051a">
<title>QUALIA / RENOVA — Libro Vivo</title>
<style>
:root{--cream:#f3ecd8;--acid:#cbff13;--cyan:#13ceb9;--line:rgba(255,255,255,.14);--T:env(safe-area-inset-top,0px);--B:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07040a;color:var(--cream);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;min-height:44px;background:transparent;border:1px solid var(--line);border-radius:10px;cursor:pointer}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 28%,#251132,#12051a 55%,#07040a)}
#bar{position:absolute;z-index:20;left:0;right:0;top:0;padding:calc(var(--T) + 8px) 10px 8px;display:flex;gap:6px;align-items:center}
.brand{font-weight:950;margin-right:auto}.brand i{color:var(--acid);font-style:normal}
.tb{padding:0 11px;font:800 11px/1 sans-serif;background:rgba(10,6,15,.6)}
#stage{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--T) + 58px) 10px calc(var(--B) + 58px)}
#frame{width:min(calc(100dvh - 130px),calc(100vw - 16px));aspect-ratio:1;background:#0d0711;box-shadow:0 24px 90px #000;overflow:hidden;touch-action:none}
#pageImg{width:100%;height:100%;object-fit:contain;display:block}
#foot{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(var(--B) + 10px);display:flex;gap:8px;align-items:center}
#count{font:800 11px ui-monospace,monospace;margin-left:auto}
#intro{position:absolute;z-index:30;inset:0;overflow:auto;background:#08050b;padding:calc(var(--T) + 40px) 24px calc(var(--B) + 40px)}
#intro h1{font-size:clamp(42px,10vw,90px);line-height:.8;letter-spacing:-.05em}#intro h1 span{color:var(--acid);display:block;font-size:.42em;margin-top:.2em}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.row a,.row button{display:grid;place-items:center;padding:0 18px;border-radius:999px;font-weight:900;text-decoration:none;color:inherit}
.go{background:var(--acid);color:#100519;border:0}.ghost{border:1px solid var(--line)}
#lab{position:absolute;z-index:40;inset:0;display:none;background:#050308}#lab.open{display:block}
#labCanvas{width:100%;height:100%;touch-action:none}
.modes{position:absolute;left:50%;bottom:calc(var(--B) + 10px);transform:translateX(-50%);display:flex;gap:4px;overflow:auto;max-width:94vw;padding:6px;border:1px solid var(--line);border-radius:999px;background:rgba(7,5,10,.8)}
.modes button{border:0;padding:0 12px;border-radius:999px;font:800 9px ui-monospace,monospace;color:#918696}
.modes button.on{background:var(--cream);color:#12051a}
#read{position:absolute;left:14px;bottom:calc(var(--B) + 64px);max-width:70vw;font:10px/1.45 ui-monospace,monospace;pointer-events:none}
#read b{display:block;font:950 clamp(26px,7vw,72px)/.86 sans-serif;color:#fff;letter-spacing:-.05em;margin-bottom:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
<header id="bar">
  <div class="brand">QUALIA / <i>ℜENOVA</i></div>
  <button class="tb" id="labBtn">GENERADOR</button>
  <a class="tb" href="index.html" style="display:grid;place-items:center;text-decoration:none">SITIO</a>
</header>
<main id="stage"><div id="frame"><img id="pageImg" alt="Lamina"></div></main>
<footer id="foot">
  <button class="tb" id="prev">←</button>
  <button class="tb" id="next">→</button>
  <span id="title">PORTADA</span>
  <span id="count">01 / 80</span>
</footer>
<section id="intro">
  <h1>QUALIA<span>/ ℜENOVA</span></h1>
  <p>El HTML es el libro. Swipe, generador, $100 MXN.</p>
  <div class="row">
    <button class="go" id="enter">ENTRAR · LIBRO VIVO</button>
    <button class="ghost" id="enterLab">PERTURBAR</button>
    <a class="ghost" href="https://buy.stripe.com/5kQ14n2TKbUq5F93vQbQY0u" target="_blank" rel="noopener">ADQUIRIR · $100 MXN</a>
  </div>
</section>
<section id="lab">
  <canvas id="labCanvas"></canvas>
  <div id="read"></div>
  <div class="modes" id="modeBar"></div>
  <button class="tb" id="labClose" style="position:absolute;top:calc(var(--T) + 10px);right:10px">×</button>
</section>
</div>
<script>
const TITLES=["PORTADA","ESTO ES / ESTO NO ES","PAGINA LEGAL","COMO PERTURBAR ESTE ARCHIVO","MAPA DE ESTACIONES","TINTAS","TODO COMIENZA DE MANERA POETICA","SILENCIO","PROTOCOLO VISUAL","YO","OTRO","VER NO ES COPIAR","EL MUNDO LLEGA INTERPRETADO","IIT x GNWT","NINGUN DIOS EN PHI","PHI ANESTESIA","INTEGRAR SIN BORRAR","BORDE DEL CAOS","PERTURBACION","PCI","LA HERIDA COMO INSTRUMENTO","5E","CUERPO NO ES CONTENEDOR","INTEROCEPCION","SELF","QUALIA = RELACION","d(qi,qj)","COLOR","MI ROJO","ATENCION","LO QUE ATIENDES","MICROVALENCIA","MANIFOLD","HIPOTESIS NO ES HECHO","GEOMETRIA SIN EXPERIENCIA","VIDA NO ES CONSCIENCIA","STENTOR","MEMORIA SIN SINAPSIS","APRENDER NO BASTA","VMEM","FORMA = MEMORIA","ACTIVE INFERENCE","UN BUCLE QUE SE CORRIGE","BEAUTIFUL LOOP","MINIMO TESTABLE","LA NOCHE","EL COLOR DE LA NOCHE","FILOSOFO CHAMAN","ARTE = PERTURBACION","RENOVA NO ES VOLVER","R = f(...)","C - G","CONTRAFACTUAL","MAS FUTUROS VIABLES","MEMORIA PRESENTE ANTICIPACION","IDENTIDAD SIN RIGIDEZ","AUTONOMIA RELACIONAL","UNO NO ES SOLO","R-01","R-02","R-03","R-04 / R-05","LAB / R","MAPA DE EVIDENCIA","QUE NOS HARIA CAMBIAR","FALSAR TAMBIEN ES CREAR","NO CONFUNDIR","CIENCIA SIN VELA PERPETUA","ORDEN Y CAOS","EL NOMBRE VIENE DESPUES","EVIDENCIA NO DECORACION","LA RETINA MIENTE","ARCHIVO COMO ORGANO","CALIGRAFIAR LA CIENCIA","REFERENCIAS 1","REFERENCIAS 2","REFERENCIAS 3","NO BUSQUES LA CONSCIENCIA","FICHA DE VENTA","COLOFON"];
const $=s=>document.querySelector(s);
let page=1,pts=new Map(),swipe=null,lastTap=0,zoom=1;
const img=$('#pageImg');
function src(n){return (window.QUALIA_PAGES&&QUALIA_PAGES[n-1])||('pages/'+String(n).padStart(2,'0')+'.webp')}
function svg(n){const t=TITLES[n-1]||('Pagina '+n);return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><rect width="800" height="800" fill="#160820"/><text x="40" y="80" fill="#13ceb9" font-size="18" font-family="monospace">'+String(n).padStart(2,'0')+' / 80</text><text x="40" y="400" fill="#cbff13" font-size="36" font-family="sans-serif">'+t+'</text></svg>')}
function show(n){page=Math.max(1,Math.min(80,n));$('#title').textContent=TITLES[page-1];$('#count').textContent=String(page).padStart(2,'0')+' / 80';img.onerror=function(){img.onerror=null;img.src=svg(page)};img.src=src(page);img.style.transform='scale(1)';zoom=1}
$('#prev').onclick=function(){show(page-1)};$('#next').onclick=function(){show(page+1)};
$('#enter').onclick=function(){$('#intro').classList.add('hidden');show(page)};
const frame=$('#frame');
frame.onpointerdown=function(e){pts.set(e.pointerId,{x:e.clientX,y:e.clientY});var now=performance.now();if(now-lastTap<280){zoom=zoom>1.1?1:2;img.style.transform='scale('+zoom+')';lastTap=0;return}lastTap=now;if(pts.size===1)swipe={x:e.clientX,y:e.clientY};};
frame.onpointerup=function(e){var s=swipe;pts.delete(e.pointerId);if(!s||pts.size)return;var dx=e.clientX-s.x,dy=e.clientY-s.y;if(Math.hypot(dx,dy)>48){if(Math.abs(dx)>=Math.abs(dy))show(page+(dx<0?1:-1));else show(page+(dy<0?1:-1))}swipe=null};
addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')show(page+1);if(e.key==='ArrowLeft')show(page-1);if(e.key.toLowerCase()==='g')openLab()});
const modes=[['afterimage','POSIMAGEN'],['chromatic','INTERFERENCIA'],['manifold','MANIFOLD'],['perturb','PERTURBACION'],['memory','MEMORIA'],['loop','ACTIVE LOOP'],['renova','FUTUROS'],['mix','MIX']];
let mode='mix',t=0,W=1,H=1,raf=0,seed=1,pointer={x:.5,y:.5},nodes=[],ctrl={sat:78,perturb:48,integr:67};
const c=$('#labCanvas'),ctx=c.getContext('2d',{alpha:false});
function satColor(h,a,l){return 'hsla('+h+','+(40+ctrl.sat*.6)+'%'+(l||60)+'%,'+(a==null?1:a)+')'}
function resizeLab(){W=c.width=innerWidth*(devicePixelRatio||1);H=c.height=innerHeight*(devicePixelRatio||1);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}
function reseed(){seed=(Math.random()*1e9)|1;nodes=Array.from({length:48},function(){return {x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.002,vy:(Math.random()-.5)*.002}})}
function labRead(h){$('#read').innerHTML=h}
function drawMix(){ctx.fillStyle='rgba(7,4,10,.08)';ctx.fillRect(0,0,W,H);var cx=pointer.x*W,cy=pointer.y*H;for(var j=0;j<8;j++){ctx.strokeStyle=satColor((seed+j*44+t*40)%360,.16);ctx.beginPath();var rr=40+j*24+Math.sin(t+j)*12;for(var k=0;k<=70;k++){var a=k/70*Math.PI*2,w=Math.sin(k*.9+t)*6*(ctrl.perturb/50);var x=cx+Math.cos(a)*(rr+w),y=cy+Math.sin(a)*(rr+w);k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}labRead('<b>EL MUNDO ANTES DEL NOMBRE</b>Color, relacion, memoria, perturbacion.')}
function drawAfterimage(){ctx.fillStyle='#07040a';ctx.fillRect(0,0,W,H);var cx=W/2,cy=H/2,r=Math.min(W,H)*.12,sh=8+Math.sin(t*1.4)*5;[['#cbff13',-sh],['#ff4165',0],['#13ceb9',sh]].forEach(function(p){ctx.fillStyle=p[0];ctx.beginPath();ctx.arc(cx+p[1],cy,r,0,7);ctx.fill()});labRead('<b>MIRA EL CENTRO.</b>8 segundos. Luego una superficie clara.')}
const draws={afterimage:drawAfterimage,mix:drawMix,chromatic:drawMix,manifold:drawMix,perturb:drawMix,memory:drawMix,loop:drawMix,renova:drawMix};
function loop(){raf=requestAnimationFrame(loop);if(!$('#lab').classList.contains('open'))return;t+=.016;(draws[mode]||drawMix)()}
function setModes(){var bar=$('#modeBar');bar.innerHTML='';modes.forEach(function(m){var b=document.createElement('button');b.textContent=m[1];b.className=m[0]===mode?'on':'';b.onclick=function(){mode=m[0];setModes()};bar.appendChild(b)})}
function openLab(){$('#lab').classList.add('open');resizeLab();reseed();setModes();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
$('#labBtn').onclick=openLab;$('#enterLab').onclick=function(){$('#intro').classList.add('hidden');openLab()};$('#labClose').onclick=function(){$('#lab').classList.remove('open')};
c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width;pointer.y=(e.clientY-r.top)/r.height});
if(location.hash.indexOf('lab=')>=0){$('#intro').classList.add('hidden');openLab()}
</script>
</body>
</html>
